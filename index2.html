            z-index: 1000;

            height: 30vh; /* Al posto di 11 <br> */
            pointer-events: none; /* IMPORTANTE: non intercetta i tap */
        }
        body {
            touch-action: manipulation; /* Migliora reattività su mobile */
        }
    </style>
</head>
